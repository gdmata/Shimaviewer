<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, width=device-width">
  <title>VittaPass - Cadastro</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
</head>

<body>
  <!-- Cabeçalho simples -->
  <header class="site-header">
    <div class="container site-header__inner">
      <a href="../index.html" class="brand">VittaPass</a>
      <button type="button" data-js-action="toggle-theme" class="btn-icon" aria-label="Alternar tema">
        <svg id="theme-icon" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16.8 12.5A7 7 0 0 1 7.5 3.2 7 7 0 1 0 16.8 12.5z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Corpo centralizado -->
  <main class="section">
    <div class="container auth-container">
      
      <div class="card card--stack">
        <div class="section-head--center head-spaced">
          <h1 class="section-title section-title--sm">Crie sua conta</h1>
          <p class="section-text">Cadastre-se para cuidar de você com a VittaPass.</p>
        </div>

        <form id="formCadastroCliente" action="#" method="post" class="card--stack">
          <!-- Campo Nome -->
          <div class="field">
            <label for="regName" class="field__label">Nome completo</label>
            <input type="text" id="regName" class="input" placeholder="Digite seu nome completo" required>
          </div>

          <!-- Campo CPF -->
          <div class="field">
            <label for="regCpf" class="field__label">CPF</label>
            <input type="text" id="regCpf" class="input" placeholder="000.000.000-00" inputmode="numeric" maxlength="14" required>
          </div>
          
          <!-- Campo E-mail -->
          <div class="field">
            <label for="regMail" class="field__label">Endereço de e-mail</label>
            <input type="email" id="regMail" class="input" placeholder="voce@exemplo.com" required>
          </div>

          <!-- Campo Senha -->
          <div class="field">
            <label for="regPass" class="field__label">Senha</label>
            <div class="relative-box">
              <input type="password" id="regPass" class="input input-password-pad" placeholder="Crie sua senha" required>
              <button type="button" aria-label="Mostrar senha" data-js-action="toggle-password" class="password-toggle-btn">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <path d="M1 9C1 9 4 3 9 3C14 3 17 9 17 9C17 9 14 15 9 15C4 15 1 9 1 9Z"/>
                  <circle cx="9" cy="9" r="3"/>
                </svg>
              </button>
            </div>
            <p class="fineprint">Use pelo menos 8 caracteres, com letras e números.</p>
          </div>

          <!-- Consentimento -->
          <div class="field field-spacing-sm">
            <label class="checkbox-label checkbox-align-top">
              <input type="checkbox" id="checkboxConsent" class="checkbox-spacing-top" required>
              <span class="terms-text">Li e concordo com os <a href="#" class="link-primary">Termos de Uso</a> e a <a href="#" class="link-primary">Política de Privacidade</a>.</span>
            </label>
          </div>

          <!-- Botão Principal -->
          <button type="submit" class="btn btn--primary btn--block btn--tall">Criar minha conta</button>

          <div class="text-center-spaced login-footer-text">
            <span class="footer-label">Já tem uma conta?</span>
            <a href="../Login/login.html" class="link-primary footer-link">Fazer login</a>
          </div>
        </form>
      </div>

    </div>
  </main>
  
  <script src="../../js/script.js"></script>
  <script src="../../js/auth.js?v=2"></script>
</body>

</html>
