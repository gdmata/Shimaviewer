<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <title>VittaPass - Login de Parceiro</title>
    <!-- Aponta para a folha de estilos global centralizada -->
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
</head>

<body>
    <!-- Cabeçalho simples -->
    <header class="site-header">
        <div class="container site-header__inner">
            <a href="../index.html" class="brand">VittaPass</a>
            <button type="button" data-js-action="toggle-theme" class="btn-icon" aria-label="Alternar tema">
                <svg id="theme-icon" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor"
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16.8 12.5A7 7 0 0 1 7.5 3.2 7 7 0 1 0 16.8 12.5z" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Corpo centralizado utilizando as classes do styles.css -->
    <main class="section">
        <div class="container auth-container">

            <div class="card card--stack">
                <div class="section-head--center head-spaced">
                    <h1 class="section-title section-title--sm">Portal do Parceiro</h1>
                    <p class="section-text">Acesse a gestão do seu estabelecimento.</p>

                    <!-- Seletor de Tipo de Conta no Login -->
                    <div class="tab-switch">
                        <button type="button" class="btn btn--ghost btn--sm flex-1"
                            data-js-action="navigate" data-js-href="login.html">Sou Cliente</button>
                        <button type="button" class="btn btn--primary btn--sm flex-1">Sou Parceiro</button>
                    </div>
                </div>

                <form id="formLoginParceiro" action="#" method="post" class="card--stack">
                    <!-- Campo E-mail Comercial -->
                    <div class="field">
                        <label for="loginPartnerEmail" class="field__label">E-mail comercial</label>
                        <input type="email" id="loginPartnerEmail" class="input" placeholder="parceiro@exemplo.com"
                            required>
                    </div>

                    <!-- Campo Senha -->
                    <div class="field">
                        <label for="partnerPassword" class="field__label">Senha</label>
                        <div class="relative-box">
                            <input type="password" id="partnerPassword" class="input input-password-pad"
                                placeholder="Digite sua senha" required>
                            <button type="button" aria-label="Mostrar senha" data-js-action="toggle-password-login"
                                class="password-toggle-btn">
                                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round">
                                    <path d="M1 9C1 9 4 3 9 3C14 3 17 9 17 9C17 9 14 15 9 15C4 15 1 9 1 9Z" />
                                    <circle cx="9" cy="9" r="3" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Opções auxiliares -->
                    <div class="flex-row-center text-sm">
                        <label class="checkbox-label">
                            <input type="checkbox" id="lembrarParceiro"> Lembrar de mim
                        </label>
                        <a href="#" class="link-primary">Esqueceu a senha?</a>
                    </div>

                    <!-- Botão Principal -->
                    <button type="submit" class="btn btn--primary btn--block btn--tall">Acessar painel</button>

                    <!-- Divisória opcional ou redirecionamento para cadastro -->
                    <div class="text-center-spaced">
                        <span class="footer-label">Ainda não é parceiro?</span>
                        <a href="../Cadastro/cadastro-parceiro.html" class="link-primary footer-link">Cadastre seu
                            estabelecimento</a>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <script src="../../js/script.js"></script>
    <script src="../../js/auth.js?v=2"></script>
</body>

</html>
